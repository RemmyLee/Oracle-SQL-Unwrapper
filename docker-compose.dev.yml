# Docker Compose override for development
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for development
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "True"
      LOG_LEVEL: DEBUG
    volumes:
      # Mount source code for hot reload
      - ./backend:/app/backend:ro
      - ./templates:/app/templates:ro
      - ./migrations:/app/migrations:ro
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    command: >
      sh -c "
        pip install watchdog &&
        gunicorn --reload
        --workers 2
        --worker-class sync
        --bind 0.0.0.0:8000
        --timeout 300
        --access-logfile -
        --error-logfile -
        --log-level debug
        'backend.app:create_app(\"development\")'
      "
    ports:
      - "8000:8000"
      - "5678:5678"  # Debug port

  celery:
    environment:
      FLASK_ENV: development
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app/backend:ro
      - app_logs:/app/logs

  # Database admin tool
  adminer:
    image: adminer:latest
    container_name: plsql-adminer
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - plsql-network

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: plsql-redis-commander
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-changeme}
    ports:
      - "8081:8081"
    networks:
      - plsql-network
